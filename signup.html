<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREP NOVA Sign Up</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#cae2ea,#e5e8ec);
}

/* MAIN CONTAINER */
.container{
    width:420px;
    padding:40px;
    background:rgb(239,233,196);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

/* TITLE */
.logo{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    font-size:18px;
}

/* INPUTS */
.input-box{
    margin-bottom:18px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:white;
    font-size:15px;
}

/* BUTTON */
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#d4d006f3;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* FOOTER */
.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    text-decoration:none;
    color:black;
}

/* SUCCESS POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    width:350px;
    animation:popUp 0.5s ease;
}

.checkmark{
    width:80px;
    height:80px;
    line-height:80px;
    margin:auto;
    border-radius:50%;
    background:#4CAF50;
    color:white;
    font-size:40px;
    font-weight:bold;
}

.popup-content h2{
    margin-top:20px;
}

.popup-content p{
    color:gray;
    margin-top:10px;
}

@keyframes popUp{
    from{transform:scale(0.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">PREP NOVA</div>

    <div class="subtitle">Create Your Account</div>

    <div class="input-box">
        <input type="text" id="fullname" placeholder="👤 Full Name">
    </div>

    <div class="input-box">
        <input type="tel" id="phone" placeholder="📱 Phone Number">
    </div>

    <div class="input-box">
        <input type="email" id="email" placeholder="📧 Email ID">
    </div>

    <div class="input-box">
        <input type="password" id="password" placeholder="🔒 Create Password">
    </div>

    <div class="input-box">
        <input type="password" id="confirmPassword" placeholder="🔒 Confirm Password">
    </div>

    <button onclick="createAccount()">Create Account</button>

    <div class="footer">
        Already have an account?
        <a href="index.html">Login</a>
    </div>

</div>

<!-- SUCCESS POPUP -->
<div id="successPopup" class="popup">
    <div class="popup-content">
        <div class="checkmark">✓</div>
        <h2>Account Created Successfully!</h2>
        <p>Redirecting to Login Page...</p>
    </div>
</div>

<script>
function createAccount() {

    let fullname = document.getElementById("fullname").value;
    let phone = document.getElementById("phone").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    if (
        fullname.trim() === "" ||
        phone.trim() === "" ||
        email.trim() === "" ||
        password.trim() === "" ||
        confirmPassword.trim() === ""
    ) {
        alert("Please fill all fields.");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    document.getElementById("successPopup").style.display = "flex";

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2500);
}
</script>

</body>
</html>
