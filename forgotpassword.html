<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREP NOVA - Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#cae2ea,#e5e8ec);
}

.container{
    width:420px;
    padding:40px;
    background:rgb(239,233,196);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.logo{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-box{
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:white;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#d4d006f3;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#c5c105;
}

.footer{
    text-align:center;
    margin-top:20px;
}

.footer a{
    color:black;
    text-decoration:none;
}

    

</style>
</head>
<body>
 

<div class="container">

<div class="logo">PREP NOVA</div>

<div class="subtitle">
Reset Your Password
</div>

<div class="input-box">
<input type="email" placeholder="📧 Enter Your Registered Email ID">
</div>

<button>Send Reset Link</button>

<div class="footer">
<br>
<a href="index.html">← Back to Login</a>
</div>

</div>

</body>
</html>
